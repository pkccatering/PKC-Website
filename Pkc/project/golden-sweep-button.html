<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golden Sweep Button Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 2rem;
    }

    .demo-container {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      align-items: center;
    }

    .button-row {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* Base Button Styling */
    .sweep-button {
      position: relative;
      padding: 1rem 2.5rem;
      font-size: 1.125rem;
      font-weight: 600;
      color: #2c3e50;
      background: #ffffff;
      border: 2px solid #d4af37;
      border-radius: 0.5rem;
      cursor: pointer;
      overflow: hidden;
      transition: color 0.4s ease;
    }

    /* Golden sweep effect using ::before pseudo-element */
    .sweep-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #d4af37 0%, #f9d976 50%, #d4af37 100%);
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 0;
    }

    .sweep-button {
      z-index: 1;
    }

    .sweep-button > * {
      position: relative;
      z-index: 2;
    }

    /* Hover state - expand the golden fill */
    .sweep-button:hover::before {
      width: 100%;
    }

    /* Change text color on hover for better contrast */
    .sweep-button:hover {
      color: #1a202c;
      border-color: #b8932d;
    }

    /* Active state for click feedback */
    .sweep-button:active {
      transform: scale(0.98);
    }

    /* Focus state for accessibility */
    .sweep-button:focus {
      outline: 3px solid rgba(212, 175, 55, 0.5);
      outline-offset: 2px;
    }

    /* Variation 1: Sweep from Right */
    .sweep-right::before {
      left: auto;
      right: 0;
    }

    /* Variation 2: Sweep from Center */
    .sweep-center::before {
      left: 50%;
      transform: translateX(-50%);
    }

    /* Variation 3: Sweep from Top */
    .sweep-top::before {
      width: 100%;
      height: 0;
      transition: height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sweep-top:hover::before {
      height: 100%;
    }

    /* Variation 4: Sweep from Bottom */
    .sweep-bottom::before {
      width: 100%;
      height: 0;
      top: auto;
      bottom: 0;
      transition: height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sweep-bottom:hover::before {
      height: 100%;
    }

    /* Variation 5: Fast Sweep */
    .sweep-fast::before {
      transition: width 0.25s ease-out;
    }

    /* Variation 6: Slow Elegant Sweep */
    .sweep-slow::before {
      transition: width 0.6s ease-in-out;
    }

    /* Dark variant button */
    .sweep-button-dark {
      background: #1a202c;
      color: #f7fafc;
      border-color: #d4af37;
    }

    .sweep-button-dark:hover {
      color: #1a202c;
    }

    /* Label styling */
    .label {
      color: #ffffff;
      font-size: 0.875rem;
      text-align: center;
      margin-top: 0.5rem;
      opacity: 0.9;
    }

    h1 {
      color: #ffffff;
      font-size: 2.5rem;
      text-align: center;
      margin-bottom: 1rem;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
    }

    .section-title {
      color: #ffffff;
      font-size: 1.5rem;
      margin-top: 2rem;
      margin-bottom: 1rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Golden Sweep Button Animations</h1>

  <div class="demo-container">
    <!-- Standard Directions -->
    <h2 class="section-title">Sweep Directions</h2>
    <div class="button-row">
      <div>
        <button class="sweep-button"><span>Sweep Left to Right</span></button>
        <p class="label">Default (Left)</p>
      </div>
      <div>
        <button class="sweep-button sweep-right"><span>Sweep Right to Left</span></button>
        <p class="label">Right Direction</p>
      </div>
      <div>
        <button class="sweep-button sweep-center"><span>Sweep from Center</span></button>
        <p class="label">Center Expand</p>
      </div>
    </div>

    <!-- Vertical Sweeps -->
    <h2 class="section-title">Vertical Sweeps</h2>
    <div class="button-row">
      <div>
        <button class="sweep-button sweep-top"><span>Sweep Top to Bottom</span></button>
        <p class="label">Top Direction</p>
      </div>
      <div>
        <button class="sweep-button sweep-bottom"><span>Sweep Bottom to Top</span></button>
        <p class="label">Bottom Direction</p>
      </div>
    </div>

    <!-- Speed Variations -->
    <h2 class="section-title">Speed Variations</h2>
    <div class="button-row">
      <div>
        <button class="sweep-button sweep-fast"><span>Quick Sweep</span></button>
        <p class="label">0.25s Duration</p>
      </div>
      <div>
        <button class="sweep-button"><span>Normal Sweep</span></button>
        <p class="label">0.4s Duration</p>
      </div>
      <div>
        <button class="sweep-button sweep-slow"><span>Elegant Sweep</span></button>
        <p class="label">0.6s Duration</p>
      </div>
    </div>

    <!-- Dark Variant -->
    <h2 class="section-title">Theme Variants</h2>
    <div class="button-row">
      <div>
        <button class="sweep-button sweep-button-dark"><span>Dark Theme Button</span></button>
        <p class="label">Dark Background</p>
      </div>
    </div>
  </div>
</body>
</html>
